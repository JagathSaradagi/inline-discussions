<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zefina Inline Discussion Engine Demo</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
      .container {
        max-width: 800px;
        margin: 40px auto;
        padding: 24px;
        background: #1e293b;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }
      .header {
        border-bottom: 1px solid #334155;
        padding-bottom: 16px;
        margin-bottom: 24px;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        background: #0284c7;
        color: white;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .input-box {
        margin-top: 16px;
        padding: 12px;
        background: #0f172a;
        border: 1px solid #38bdf8;
        border-radius: 8px;
      }
      .input-box textarea {
        width: 100%;
        background: transparent;
        border: none;
        color: white;
        font-size: 14px;
        resize: vertical;
        outline: none;
        box-sizing: border-box;
      }
      .button-group {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .btn {
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: none;
      }
      .btn-primary {
        background: #0284c7;
        color: white;
      }
      .btn-secondary {
        background: #475569;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
